services:
  # 1. PostgreSQL 16 Enterprise Financial Database (§5)
  postgres:
    image: postgres:16-alpine
    container_name: sfms-postgres
    restart: always
    environment:
      POSTGRES_DB: sanjeevani_finance
      POSTGRES_USER: sfms_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SanjeevaniSecret2026!}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=16MB
        -c wal_level=replica
        -c archive_mode=on

  # 2. Redis 7 High-Performance Cache & Session Engine (§5)
  redis:
    image: redis:7-alpine
    container_name: sfms-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-SanjeevaniRedis2026!} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # 3. MinIO S3-Compatible KYC & Receipt Object Store (§5)
  minio:
    image: minio/minio:latest
    container_name: sfms-minio
    restart: always
    environment:
      MINIO_ROOT_USER: sfms_s3_admin
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD:-SanjeevaniStorage2026!}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # 4. NestJS API Backend (§5, §6)
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: sfms-api
    restart: always
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-sanjeevani-finance-jwt-super-secret-key-2026}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: sfms_admin
      DB_PASSWORD: ${DB_PASSWORD:-SanjeevaniSecret2026!}
      DB_NAME: sanjeevani_finance
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-SanjeevaniRedis2026!}
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"

  # 5. Next.js Admin Web Dashboard (§5, §8)
  admin-web:
    build:
      context: ..
      dockerfile: apps/admin-web/Dockerfile
    container_name: sfms-admin-web
    restart: always
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    depends_on:
      - api
    ports:
      - "3000:3000"

  # 6. Nginx SSL Reverse Proxy (§82)
  nginx:
    image: nginx:alpine
    container_name: sfms-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - admin-web

volumes:
  pgdata:
  redisdata:
  miniodata:
